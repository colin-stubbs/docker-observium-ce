name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: build/Dockerfile
          config: .hadolint.yaml
          failure-threshold: warning
      - uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: build
          severity: warning
